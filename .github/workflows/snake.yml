# 🐍 GitHub Contribution Snake Animation
# This workflow generates an animated snake SVG from your contribution graph
# The snake eats your contributions as it moves across the grid!

name: Generate Snake Animation

on:
  # Run automatically every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Also run on every push to main
  push:
    branches:
      - main
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate the custom NISHANT contribution snake SVG animations & custom aesthetic cards
      - name: Generate NISHANT Snake & Stats Cards
        run: |
          python3 scripts/generate_snake.py
          python3 scripts/generate_cards.py

      # Deploy interactive vinyl web player to GitHub Pages
      - name: Prepare Vinyl Player Web App
        run: |
          cp index.html dist/index.html
          mkdir -p dist/assets
          cp assets/music.mp3 dist/assets/music.mp3
          cp assets/music.mp3 dist/music.mp3
          cp assets/vinyl-player.gif dist/assets/vinyl-player.gif

      # Push the generated files to the output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
