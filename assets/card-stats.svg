<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 205" width="100%" height="auto">

    <defs>
      <!-- Gradient Palettes: Cyber Aurora (Cyan -> Emerald -> Purple) -->
      <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f2fe" />
        <stop offset="60%" stop-color="#38ef7d" />
        <stop offset="100%" stop-color="#a855f7" />
      </linearGradient>
      <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f2fe" />
        <stop offset="100%" stop-color="#4facfe" />
      </linearGradient>
      <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#c084fc" />
        <stop offset="100%" stop-color="#a855f7" />
      </linearGradient>
      <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="50%" stop-color="#090d16" />
        <stop offset="100%" stop-color="#070a10" />
      </linearGradient>
      <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(0, 242, 254, 0.4)" />
        <stop offset="50%" stop-color="rgba(56, 239, 125, 0.25)" />
        <stop offset="100%" stop-color="rgba(168, 85, 247, 0.35)" />
      </linearGradient>
      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f2fe" />
        <stop offset="60%" stop-color="#38ef7d" />
        <stop offset="100%" stop-color="#c084fc" />
      </linearGradient>
      
      <!-- Subtle Glow Filter -->
      <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3.5" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&amp;family=Outfit:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
        .card-frame { fill: url(#cardBg); stroke: url(#cardBorder); stroke-width: 1.5px; rx: 18px; ry: 18px; }
        .card-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; fill: url(#titleGrad); letter-spacing: -0.2px; }
        .stat-label { font-family: 'Outfit', -apple-system, sans-serif; font-size: 13.5px; fill: #94a3b8; font-weight: 500; }
        .stat-val { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 15px; fill: #ffffff; font-weight: 700; }
        .big-stat { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
        .caption { font-family: 'Outfit', -apple-system, sans-serif; font-size: 12px; fill: #64748b; font-weight: 500; }
        .badge-txt { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #00f2fe; letter-spacing: 0.8px; }
        .grade-score { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 27px; font-weight: 800; fill: url(#titleGrad); }
        .repo-desc { font-family: 'Outfit', -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; line-height: 1.45; }
        .repo-lang { font-family: 'Outfit', -apple-system, sans-serif; font-size: 12.5px; fill: #cbd5e1; font-weight: 600; }
      </style>
    </defs>
    
<rect width="480" height="205" class="card-frame" />
<ellipse cx="240.0" cy="0" rx="160" ry="12" fill="#00f2fe" opacity="0.08" filter="url(#neonGlow)" />
<text x="24" y="37" class="card-title" font-size="18">Nishant Ranjan's GitHub Stats</text>
<circle cx="32" cy="63" r="4" fill="#f1c40f" filter="url(#softGlow)" />
<text x="44" y="67" class="stat-label">Total Stars Earned:</text>
<text x="215" y="67" class="stat-val">1</text>
<circle cx="32" cy="90" r="4" fill="#00f2fe" filter="url(#softGlow)" />
<text x="44" y="94" class="stat-label">Total Commits:</text>
<text x="215" y="94" class="stat-val">262</text>
<circle cx="32" cy="117" r="4" fill="#c084fc" filter="url(#softGlow)" />
<text x="44" y="121" class="stat-label">Total Pull Requests:</text>
<text x="215" y="121" class="stat-val">22</text>
<circle cx="32" cy="144" r="4" fill="#38ef7d" filter="url(#softGlow)" />
<text x="44" y="148" class="stat-label">Total Issues Closed:</text>
<text x="215" y="148" class="stat-val">0</text>
<circle cx="32" cy="171" r="4" fill="#38ef7d" filter="url(#softGlow)" />
<text x="44" y="175" class="stat-label">Contributed to:</text>
<text x="215" y="175" class="stat-val">3 Repos</text>
<circle cx="378" cy="114" r="46" stroke="rgba(255,255,255,0.06)" stroke-width="7" fill="none" />
<circle cx="378" cy="114" r="46" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="30" fill="none" filter="url(#neonGlow)" />
<text x="378" y="124" text-anchor="middle" class="grade-score">A+</text>
<text x="378" y="150" text-anchor="middle" class="badge-txt">SUPER ARCHITECT</text>
</svg>